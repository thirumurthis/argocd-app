---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 0-sync-wave
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/thirumurthis/argocd-app.git
    path: argocd_sync_wave/wave-0
    targetRevision: HEAD
  destination:
    name: in-cluster
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true