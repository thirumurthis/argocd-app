---
apiVersion: batch/v1
kind: Job
metadata:
  name: job-l2-w1-j21-sleep-sw-10
  namespace: demo-ns
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  template:
    spec:
      serviceAccountName: argocd-server
      containers:
        - name: sleep
          image: ubuntu:latest
          command:
            - /bin/sh
            - -c
            - |
              sleep 10
      restartPolicy: Never
  backoffLimit: 1