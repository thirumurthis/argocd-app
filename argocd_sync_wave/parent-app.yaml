---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parent-app
  namespace: &argons argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/thirumurthis/argocd-app.git
    path: argocd_sync_wave/app-waves
    targetRevision: HEAD
  destination:
    name: in-cluster
    namespace: *argons
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true